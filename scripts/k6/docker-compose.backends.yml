services:
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      [ "server", "--address", ":9000", "--console-address", ":9001", "/data" ]
    ports:
      - "${MINIO_API_BIND:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1:9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
    volumes:
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/minio:/data"

  minio-distributed:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      [
        "server",
        "--address",
        ":9000",
        "--console-address",
        ":9001",
        "http://minio-distributed/data",
        "http://minio2/data",
        "http://minio3/data",
        "http://minio4/data",
      ]
    ports:
      - "${MINIO_API_BIND:-127.0.0.1:9000}:9000"
      - "${MINIO_CONSOLE_BIND:-127.0.0.1:9001}:9001"
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
    volumes:
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/minio1:/data"
    depends_on:
      - minio2
      - minio3
      - minio4

  minio2:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      [
        "server",
        "--address",
        ":9000",
        "--console-address",
        ":9001",
        "http://minio-distributed/data",
        "http://minio2/data",
        "http://minio3/data",
        "http://minio4/data",
      ]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
    volumes:
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/minio2:/data"

  minio3:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      [
        "server",
        "--address",
        ":9000",
        "--console-address",
        ":9001",
        "http://minio-distributed/data",
        "http://minio2/data",
        "http://minio3/data",
        "http://minio4/data",
      ]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
    volumes:
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/minio3:/data"

  minio4:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:latest}
    command:
      [
        "server",
        "--address",
        ":9000",
        "--console-address",
        ":9001",
        "http://minio-distributed/data",
        "http://minio2/data",
        "http://minio3/data",
        "http://minio4/data",
      ]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
    volumes:
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/minio4:/data"

  garage:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    command: [ "/garage", "server", "--single-node", "--default-bucket" ]
    ports:
      - "${GARAGE_S3_BIND:-127.0.0.1:3900}:3900"
      - "${GARAGE_RPC_BIND:-127.0.0.1:3901}:3901"
      - "${GARAGE_WEB_BIND:-127.0.0.1:3902}:3902"
      - "${GARAGE_ADMIN_BIND:-127.0.0.1:3903}:3903"
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
      GARAGE_DEFAULT_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-so3testkey000000}
      GARAGE_DEFAULT_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-so3testsecret0000000000000000000}
      GARAGE_DEFAULT_BUCKET: ${SO3_BUCKET:-bench}
    volumes:
      - "${GARAGE_CONFIG_FILE_FOR_RUN:-/tmp/garage.toml}:/etc/garage.toml:ro"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage-meta:/var/lib/garage/meta"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage-data:/var/lib/garage/data"

  garage-consistent:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    command: [ "/garage", "server" ]
    ports:
      - "${GARAGE_S3_BIND:-127.0.0.1:3900}:3900"
      - "${GARAGE_ADMIN_BIND:-127.0.0.1:3903}:3903"
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    volumes:
      - "${GARAGE_CONFIG_DIR:-/tmp}/garage1.toml:/etc/garage.toml:ro"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage1-meta:/var/lib/garage/meta"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage1-data:/var/lib/garage/data"
    depends_on:
      - garage2
      - garage3

  garage2:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    command: [ "/garage", "server" ]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    volumes:
      - "${GARAGE_CONFIG_DIR:-/tmp}/garage2.toml:/etc/garage.toml:ro"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage2-meta:/var/lib/garage/meta"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage2-data:/var/lib/garage/data"

  garage3:
    image: ${GARAGE_IMAGE:-dxflrs/garage:v2.3.0}
    command: [ "/garage", "server" ]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    volumes:
      - "${GARAGE_CONFIG_DIR:-/tmp}/garage3.toml:/etc/garage.toml:ro"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage3-meta:/var/lib/garage/meta"
      - "${RUN_DATA_DIR:?RUN_DATA_DIR is required}/garage3-data:/var/lib/garage/data"

[package]
name = "so3-core"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-util = { workspace = true }
tokio-stream = { workspace = true, features = ["net"] }
axum = { workspace = true }
tower-http = { workspace = true, features = ["trace", "timeout"] }
tower = { workspace = true, features = ["util"] }
bytes = { workspace = true }
httpdate = { workspace = true }
serde = { workspace = true, features = ["derive", "std"] }
serde_json = { workspace = true, features = ["std"] }
toml = { workspace = true, features = ["parse", "serde"] }
tonic = { workspace = true, features = ["codegen", "router", "transport"] }
tonic-prost = { workspace = true }
prost = { workspace = true, features = ["derive", "std"] }
tracing = { workspace = true }
async-trait = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
postcard = { workspace = true, features = ["alloc"] }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite"] }
sha2 = { workspace = true }
tempfile = { workspace = true }

[build-dependencies]
tonic-prost-build = { workspace = true }

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }

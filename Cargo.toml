[workspace]
resolver = "2"

members = [
    "src/api/core",
    "src/api/s3", "src/api/types",
    "src/blob-store/core",
    "src/blob-store/fs",
    "src/blob-store/types",
    "src/consensus/accord",
    "src/consensus/core",
    "src/consensus/types",
    "src/core",
    "src/meta-store/core",
    "src/meta-store/inmem",
    "src/meta-store/sqlite",
    "src/meta-store/types",
    "src/so3",
]

default-members = ["src/so3"]

[workspace.package]
version = "0.1.0"
authors = ["Bromles <bromles@yandex.ru>"]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true

[workspace.dependencies]
so3-core = { path = "src/core" }
so3-api-types = { path = "src/api/types" }
so3-api-core = { path = "src/api/core" }
so3-api-s3 = { path = "src/api/s3" }
so3-blob-store-types = { path = "src/blob-store/types" }
so3-blob-store-core = { path = "src/blob-store/core" }
so3-blob-store-fs = { path = "src/blob-store/fs" }
so3-consensus-types = { path = "src/consensus/types" }
so3-consensus-core = { path = "src/consensus/core" }
so3-consensus-accord = { path = "src/consensus/accord" }
so3-meta-store-types = { path = "src/meta-store/types" }
so3-meta-store-core = { path = "src/meta-store/core" }
so3-meta-store-inmem = { path = "src/meta-store/inmem" }
so3-meta-store-sqlite = { path = "src/meta-store/sqlite" }

# compression
zstd = { version = "0.13", default-features = false }
async-compression = { version = "0.4", default-features = false }

# encoding
md-5 = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
hmac = { version = "0.12", default-features = false }
const-hex = { version = "1.14", default-features = false }
crc32c = { version = "0.6", default-features = false }
crc32fast = { version = "1.4", default-features = false }

# async
futures-core = { version = "0.3", default-features = false }
tokio = { version = "1.45", default-features = false }
tokio-util = { version = "0.7", default-features = false }

# serialization/deserialization
serde = { version = "1.0", default-features = false }
serde_bytes = { version = "0.11", default-features = false }
serde_json = { version = "1.0", default-features = false }
quick-xml = { version = "0.37", default-features = false }
toml = { version = "0.9", default-features = false }

# logging and tracing
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }

# db
heed = { version = "0.22", default-features = false }
rusqlite = { version = "0.36", default-features = false }
deadpool = { version = "0.12", default-features = false }

# http
http = { version = "1.3", default-features = false }
hyper = { version = "1.6", default-features = false }
hyper-util = { version = "0.1", default-features = false }

# tmp for PoC
axum = { version = "0.8" }
axum-extra = { version = "0.10", default-features = false }
reqwest = { version = "0.12", default-features = false }

# cli
clap = { version = "4.5", default-features = false }

# utils
chrono = { version = "0.4", default-features = false }
uuid = { version = "1.17", default-features = false }
bitflags = { version = "2.9", default-features = false }
async-trait = { version = "0.1", default-features = false }
thiserror = { version = "2.0", default-features = false }
anyhow = { version = "1.0", default-features = false }
mime = { version = "0.3", default-features = false }
tempfile = { version = "3.20", default-features = false }
url = { version = "2.5", default-features = false }
bytes = { version = "1.10", default-features = false }

# testing
mockall = { version = "0.13", default-features = false }
